{% extends "base.html" %}

{% block content %}
<form method="post" class="max-w-lg rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  {% csrf_token %}
  {% include "includes/form_fields.html" %}
  <div class="flex items-center gap-3">
    <button type="submit" class="rounded-lg bg-navy-950 px-4 py-2 text-sm font-semibold text-white">Save</button>
    <a href="{{ cancel_url }}" class="text-sm text-slate-500">Cancel</a>
  </div>
</form>
{% endblock %}
