{% extends "base.html" %}

{% block content %}
<form method="post" class="max-w-2xl rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  {% csrf_token %}
  {% include "includes/form_fields.html" %}
  <div class="mt-2 flex items-center gap-3">
    <button type="submit" class="rounded-lg bg-navy-950 px-4 py-2 text-sm font-semibold text-white">Save</button>
    <a href="{{ cancel_url }}" class="text-sm text-slate-500">Cancel</a>
    {% if object.pk and source != 'internal' %}
      <a href="{% url 'findings:authority_delete' object.pk %}" class="ml-auto text-sm text-red-700">Delete</a>
    {% elif object.pk %}
      <a href="{% url 'findings:internal_delete' object.pk %}" class="ml-auto text-sm text-red-700">Delete</a>
    {% endif %}
  </div>
</form>
{% endblock %}
