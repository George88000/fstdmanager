{% if data %}
  {% if max_value %}
    <div class="space-y-2">
      {% for row in data %}
        <div>
          <div class="mb-0.5 flex justify-between text-xs">
            <span>{{ row.label }}</span>
            <span class="font-mono text-slate-500">{{ row.value }}</span>
          </div>
          <div class="h-2.5 overflow-hidden rounded-md bg-slate-100">
            <div class="h-full rounded-md" style="width: {% widthratio row.value max_value 100 %}%; background: {{ row.color|default:color }};"></div>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="text-[12.5px] text-slate-500">No data yet.</p>
  {% endif %}
{% else %}
  <p class="text-[12.5px] text-slate-500">No data yet.</p>
{% endif %}
