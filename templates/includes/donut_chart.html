{% if total %}
  <div class="flex flex-wrap items-center gap-5">
    <div class="relative h-[110px] w-[110px] flex-none rounded-full" style="background: conic-gradient({{ gradient }});">
      <div class="absolute inset-4 flex items-center justify-center rounded-full bg-white font-display text-lg font-bold text-navy-900">{{ total }}</div>
    </div>
    <div class="flex min-w-[120px] flex-col gap-1.5">
      {% for row in data %}
        {% if row.value %}
          <div class="flex items-center gap-2 text-xs">
            <span class="h-2.5 w-2.5 flex-none rounded-sm" style="background: {{ row.color }};"></span>
            <span>{{ row.label }}</span>
            <span class="ml-auto font-mono text-slate-500">{{ row.value }}</span>
          </div>
        {% endif %}
      {% endfor %}
    </div>
  </div>
{% else %}
  <p class="text-[12.5px] text-slate-500">No data yet.</p>
{% endif %}
