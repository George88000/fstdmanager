{% if href %}
<a href="{{ href }}" class="inline-flex rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-xs font-semibold text-navy-900 hover:bg-slate-50{% if class %} {{ class }}{% endif %}">{{ label }}</a>
{% elif modal_url %}
<button type="button" data-modal-url="{{ modal_url }}" data-modal-wide="{{ modal_wide|default:'false' }}" class="inline-flex rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-xs font-semibold text-navy-900 hover:bg-slate-50{% if class %} {{ class }}{% endif %}">{{ label }}</button>
{% else %}
<button type="{{ type|default:'button' }}" class="inline-flex rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-xs font-semibold text-navy-900 hover:bg-slate-50{% if class %} {{ class }}{% endif %}">{{ label }}</button>
{% endif %}
