<div class="border-b border-slate-200 px-5 py-4">
  <div class="flex items-start justify-between gap-3">
    <h3 class="font-display text-base font-semibold text-navy-900">{{ title }}</h3>
    <button type="button" data-modal-close class="text-xl leading-none text-slate-400 hover:text-navy-900">&times;</button>
  </div>
</div>
<div class="max-h-[64vh] overflow-y-auto px-5 py-4 text-sm">{{ body }}</div>
{% if footer %}
<div class="flex justify-end gap-2 border-t border-slate-200 px-5 py-3">{{ footer }}</div>
{% endif %}
