{% if status == "over" %}
  <span class="inline-flex items-center gap-1 rounded-full bg-red-100 px-2 py-0.5 text-[11px] font-semibold text-red-800"><span class="h-1.5 w-1.5 rounded-full bg-current"></span>Overdue{{ extra }}</span>
{% elif status == "soon" %}
  <span class="inline-flex items-center gap-1 rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-semibold text-amber-deep"><span class="h-1.5 w-1.5 rounded-full bg-current"></span>Due soon{{ extra }}</span>
{% elif status == "ok" %}
  <span class="inline-flex items-center gap-1 rounded-full bg-emerald-100 px-2 py-0.5 text-[11px] font-semibold text-emerald-800"><span class="h-1.5 w-1.5 rounded-full bg-current"></span>On track{{ extra }}</span>
{% else %}
  <span class="inline-flex items-center gap-1 rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-600"><span class="h-1.5 w-1.5 rounded-full bg-current"></span>Not scheduled{{ extra }}</span>
{% endif %}
