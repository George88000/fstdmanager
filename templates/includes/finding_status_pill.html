{% if status == "Closed" %}
  <span class="inline-flex rounded-full bg-emerald-100 px-2 py-0.5 text-[11px] font-semibold text-emerald-800">{{ status }}</span>
{% elif status == "Open" %}
  <span class="inline-flex rounded-full bg-red-100 px-2 py-0.5 text-[11px] font-semibold text-red-800">{{ status }}</span>
{% elif status == "In Progress" %}
  <span class="inline-flex rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-semibold text-amber-deep">{{ status }}</span>
{% elif status == "Awaiting Authority" %}
  <span class="inline-flex rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-600">{{ status }}</span>
{% else %}
  <span class="inline-flex rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-600">{{ status }}</span>
{% endif %}
